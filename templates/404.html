{% extends 'base.html' %}

{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
<div class="min-h-[60vh] flex flex-col items-center justify-center text-center px-4">
    <div class="relative w-32 h-32 mb-8 mx-auto flex items-center justify-center">
        <!-- Glow effect -->
        <div class="absolute inset-0 bg-brand-500/20 rounded-full blur-2xl"></div>
        <i data-lucide="compass" class="w-20 h-20 text-brand-500 relative z-10 animate-[pulse_3s_ease-in-out_infinite]"></i>
    </div>
    
    <h1 class="text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-white to-gray-500 mb-4 tracking-tighter">404</h1>
    <h2 class="text-2xl font-bold text-white mb-2">Looks like you're lost in space</h2>
    <p class="text-gray-400 max-w-md mx-auto mb-8 text-lg">The page you are looking for doesn't exist, has been moved, or is temporarily unavailable.</p>
    
    <a href="{{ url_for('dashboard') if current_user() else url_for('index') }}" class="inline-flex items-center px-6 py-3 bg-brand-600 hover:bg-brand-500 text-white rounded-xl font-medium transition-all duration-200 shadow-[0_0_20px_rgba(59,130,246,0.3)] hover:shadow-[0_0_30px_rgba(59,130,246,0.5)] transform hover:-translate-y-0.5">
        <i data-lucide="home" class="w-5 h-5 mr-2"></i>
        Take Me Home
    </a>
</div>
{% endblock %}
