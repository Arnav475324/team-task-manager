{% extends 'base.html' %}

{% block title %}500 - Server Error{% endblock %}

{% block content %}
<div class="min-h-[60vh] flex flex-col items-center justify-center text-center px-4">
    <div class="relative w-32 h-32 mb-8 mx-auto flex items-center justify-center">
        <!-- Glow effect -->
        <div class="absolute inset-0 bg-red-500/20 rounded-full blur-2xl"></div>
        <i data-lucide="alert-triangle" class="w-20 h-20 text-red-500 relative z-10 animate-bounce"></i>
    </div>
    
    <h1 class="text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-red-400 to-red-800 mb-4 tracking-tighter">500</h1>
    <h2 class="text-2xl font-bold text-white mb-2">Server Error</h2>
    <p class="text-gray-400 max-w-md mx-auto mb-8 text-lg">Oops! Something went wrong on our end. Our engineering team has been notified. Please try again later.</p>
    
    <div class="flex gap-4">
        <a href="javascript:window.location.reload(true)" class="inline-flex items-center px-6 py-3 bg-white/5 hover:bg-white/10 border border-white/10 text-white rounded-xl font-medium transition-all duration-200 backdrop-blur-sm">
            <i data-lucide="refresh-cw" class="w-5 h-5 mr-2"></i>
            Refresh Page
        </a>
        <a href="{{ url_for('dashboard') if current_user() else url_for('index') }}" class="inline-flex items-center px-6 py-3 bg-brand-600 hover:bg-brand-500 text-white rounded-xl font-medium transition-all duration-200 shadow-[0_0_20px_rgba(59,130,246,0.3)] hover:shadow-[0_0_30px_rgba(59,130,246,0.5)]">
            <i data-lucide="home" class="w-5 h-5 mr-2"></i>
            Go Home
        </a>
    </div>
</div>
{% endblock %}
